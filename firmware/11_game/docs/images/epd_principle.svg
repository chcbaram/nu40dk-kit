<text x="60" y="374" font-size="12" font-weight="normal" fill="#333" text-anchor="start">· 흰 입자와 검은 입자는 서로 반대 전하를 띤다. 픽셀 전극에 + / − 전압을 걸면 한쪽 입자가 앞쪽(보는 쪽)으로 끌려온다.</text>
<text x="60" y="396" font-size="12" font-weight="normal" fill="#333" text-anchor="start">· 입자가 실제로 액체 속을 움직이므로 수십~수백 ms 가 걸린다 → LCD 보다 느림.  전압을 끊어도 입자는 그 자리에 머문다 → 정지 화면은 전력 0.</text>
