<rect x="680" y="95" width="280" height="352" rx="12" fill="#f7f9fc" stroke="#d5dae1"/>
<text x="696" y="119" font-size="12" font-weight="bold" fill="#111" text-anchor="start">읽는 법</text>
<text x="696" y="139" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">줄 = 지금 색, 칸 = 바꿀 색</text>
<text x="696" y="159" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">숫자 = 32ms 펄스를 몇 번</text>
<text x="696" y="199" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">예 1 (빨간 테두리)</text>
<text x="696" y="219" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">W 줄, D 칸 = 3</text>
<text x="696" y="239" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">흰색 → 진회색:</text>
<text x="696" y="259" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">검정 쪽으로 3번</text>
<text x="696" y="299" font-size="12" font-weight="bold" fill="#3b6fb6" text-anchor="start">예 2 (파란 테두리)</text>
<text x="696" y="319" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">K 줄, W 칸 = 6</text>
<text x="696" y="339" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">검정 → 흰색:</text>
<text x="696" y="359" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">흰색 쪽으로 6번</text>
<text x="696" y="399" font-size="11.5" font-weight="normal" fill="#c0392b" text-anchor="start">오른쪽 위 = 어두워짐 (빨강)</text>
<text x="696" y="419" font-size="11.5" font-weight="normal" fill="#3b6fb6" text-anchor="start">왼쪽 아래 = 밝아짐 (파랑)</text>
<rect x="20" y="471" width="940" height="65" rx="10" fill="#fff8e6" stroke="#e8cf8f"/>
<text x="36" y="495" font-size="12" font-weight="bold" fill="#6b4e00" text-anchor="start">줄여 쓴 표기  W{0,1,3,9}  L{2,0,2,8}  D{4,2,0,6}  K{6,3,2,0}  는 이 표를 한 줄씩 적은 것이다.</text>
<text x="36" y="517" font-size="11.5" font-weight="normal" fill="#6b4e00" text-anchor="start">예: W{0,1,3,9} = 흰색에서 → 흰색 0번, 연회색 1번, 진회색 3번, 검정 9번.  "W→D" 처럼 쓰면 W 줄 D 칸 (흰색에서 진회색으로) 이다.</text>
</svg>