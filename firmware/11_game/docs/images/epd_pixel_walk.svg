<text x="36" y="484" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">· 스캔 한 번(32ms)마다 카운터가 남은 픽셀만 한 펄스 구동하고 1 줄인다. 0 이 되면 마스크가 0 / 0 이라 전압 0 → 진회색에서 멈추고 전력 없이 유지된다.</text>
<text x="36" y="504" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">· 화면의 모든 픽셀이 같은 스캔 안에서 동시에 구동된다. 바뀐 픽셀이 많아도 걸리는 시간은 같다 (펄스 수가 가장 많은 픽셀이 끝날 때까지).</text>
