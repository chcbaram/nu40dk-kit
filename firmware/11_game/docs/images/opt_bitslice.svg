<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#5b6b7f"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="980" height="430" fill="#ffffff"/>
<text x="490.0" y="32" font-size="17" font-weight="bold" fill="#111" text-anchor="middle">화면 쪽 핵심: 32픽셀 카운터를 명령 몇 개로 한꺼번에 줄이기 (비트 슬라이스)</text>
<text x="30" y="70" font-size="13" font-weight="bold" fill="#3d4a5c" text-anchor="start">보통 방식: 픽셀마다 카운터 1바이트</text>
<rect x="30" y="84" width="46" height="40" rx="4" fill="#fff8e6" stroke="#c9a54a" />
<text x="53" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">3</text>
<text x="53" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P0</text>
<rect x="82" y="84" width="46" height="40" rx="4" fill="#f3f4f6" stroke="#c9a54a" />
<text x="105" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="105" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P1</text>
<rect x="134" y="84" width="46" height="40" rx="4" fill="#fff8e6" stroke="#c9a54a" />
<text x="157" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">2</text>
<text x="157" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P2</text>
<rect x="186" y="84" width="46" height="40" rx="4" fill="#f3f4f6" stroke="#c9a54a" />
<text x="209" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="209" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P3</text>
<rect x="238" y="84" width="46" height="40" rx="4" fill="#fff8e6" stroke="#c9a54a" />
<text x="261" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">5</text>
<text x="261" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P4</text>
<rect x="290" y="84" width="46" height="40" rx="4" fill="#fff8e6" stroke="#c9a54a" />
<text x="313" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<text x="313" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P5</text>
<rect x="342" y="84" width="46" height="40" rx="4" fill="#f3f4f6" stroke="#c9a54a" />
<text x="365" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="365" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P6</text>
<rect x="394" y="84" width="46" height="40" rx="4" fill="#f3f4f6" stroke="#c9a54a" />
<text x="417" y="110" font-size="15" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="417" y="140" font-size="10" font-weight="normal" fill="#777" text-anchor="middle">P7</text>
<text x="30" y="166" font-size="11.5" font-weight="normal" fill="#c0392b" text-anchor="start">→ 픽셀 23,040개를 하나씩 "0 보다 크면 1 빼기"</text>
<text x="30" y="184" font-size="11.5" font-weight="normal" fill="#c0392b" text-anchor="start">   스캔마다 수만 번 분기 → 첫 구현 디스플레이 CPU 15~19%</text>
<text x="500" y="70" font-size="13" font-weight="bold" fill="#3d4a5c" text-anchor="start">비트 슬라이스: 같은 자리 비트끼리 32비트 워드로</text>
<text x="540" y="106" font-size="11" font-weight="bold" fill="#555" text-anchor="end">bit0</text>
<rect x="550" y="84" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="565" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="584" y="84" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="599" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="618" y="84" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="633" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="652" y="84" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="667" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="686" y="84" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="701" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="720" y="84" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="735" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="754" y="84" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="769" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="788" y="84" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="803" y="103" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="828" y="103" font-size="10.5" font-weight="normal" fill="#777" text-anchor="start">… 32픽셀</text>
<text x="540" y="140" font-size="11" font-weight="bold" fill="#555" text-anchor="end">bit1</text>
<rect x="550" y="118" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="565" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="584" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="599" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="618" y="118" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="633" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="652" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="667" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="686" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="701" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="720" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="735" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="754" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="769" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="788" y="118" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="803" y="137" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="828" y="137" font-size="10.5" font-weight="normal" fill="#777" text-anchor="start">… 32픽셀</text>
<text x="540" y="174" font-size="11" font-weight="bold" fill="#555" text-anchor="end">bit2</text>
<rect x="550" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="565" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="584" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="599" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="618" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="633" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="652" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="667" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="686" y="152" width="30" height="28" rx="3" fill="#dbe7f7" stroke="#9db6d9"/>
<text x="701" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">1</text>
<rect x="720" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="735" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="754" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="769" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<rect x="788" y="152" width="30" height="28" rx="3" fill="#fff" stroke="#9db6d9"/>
<text x="803" y="171" font-size="12" font-weight="bold" fill="#222" text-anchor="middle">0</text>
<text x="828" y="171" font-size="10.5" font-weight="normal" fill="#777" text-anchor="start">… 32픽셀</text>
<text x="500" y="200" font-size="11" font-weight="normal" fill="#555" text-anchor="start">P0 = 3 = 011, P4 = 5 = 101 처럼 세로로 읽는다</text>
<rect x="20" y="222" width="940" height="190" rx="12" fill="#f7f9fc" stroke="#d5dae1"/>
<text x="40" y="250" font-size="13" font-weight="bold" fill="#111" text-anchor="start">한 스캔에서 하는 일 (32픽셀씩)</text>
<text x="40" y="280" font-size="12" font-weight="bold" fill="#3b6fb6" text-anchor="start">남은 일이 있나?</text>
<text x="180" y="280" font-size="11.5" font-family="Menlo, monospace" fill="#222">active = bit0 | bit1 | bit2 | bit3 | bit4</text>
<text x="600" y="280" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">OR 4번 → 0 이면 32픽셀 통째로 건너뜀</text>
<text x="40" y="316" font-size="12" font-weight="bold" fill="#3b6fb6" text-anchor="start">1 빼기</text>
<text x="180" y="316" font-size="11.5" font-family="Menlo, monospace" fill="#222">borrow 를 XOR·AND 로 전파</text>
<text x="600" y="316" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">명령 10여 개로 32픽셀 동시에 −1</text>
<text x="40" y="352" font-size="12" font-weight="bold" fill="#3b6fb6" text-anchor="start">마스크 만들기</text>
<text x="180" y="352" font-size="11.5" font-family="Menlo, monospace" fill="#222">바뀐 묶음과 0 이 된 묶음만 다시 계산</text>
<text x="600" y="352" font-size="11.5" font-weight="normal" fill="#444" text-anchor="start">매 스캔 전체를 새로 만들지 않음</text>
<text x="40" y="398" font-size="12" font-weight="bold" fill="#2e7d32" text-anchor="start">결과: 디스플레이 CPU 15~19% → 4~6%, 정지 화면(남은 일 0)에서는 거의 0. 비켜 준 CPU 가 에뮬레이터 속도로 돌아간다.</text>
</svg>