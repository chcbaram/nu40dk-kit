<text x="490.0" y="402" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">① 은 속도(%)에서 환산한 값. 사운드 합성도 프레임당 2.6 → 1.5ms 로 줄여 예산 안에서 22kHz 사운드까지 같이 돈다</text>
