<text x="490" y="521" font-size="11.5" font-weight="bold" fill="#6b4e00" text-anchor="middle">펄스 수 = 움직인 거리 = 밝기.  같은 펄스라도 출발 위치·방향·머문 시간에 따라 움직이는 양이 달라 → 표(캘리브레이션)로 횟수를 정한다</text>
