<text x="400" y="30" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">Xbox BLE 패드 연결 순서</text><rect x="80" y="50" width="180" height="40" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="170.0" y="75.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">nRF52840 (central)</text><rect x="540" y="50" width="180" height="40" rx="8" fill="#eefbef" stroke="#3a9a4a" stroke-width="1.5"/><text x="630.0" y="75.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">Xbox 컨트롤러</text><line x1="170" y1="90" x2="170" y2="560" stroke="#999" stroke-dasharray="5,4"/><line x1="630" y1="90" x2="630" y2="560" stroke="#999" stroke-dasharray="5,4"/><line x1="630" y1="120" x2="170" y2="120" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="114.0" font-size="11" fill="#555" text-anchor="middle">광고 (이름 "Xbox…" / 본딩 주소, RSSI > -75)</text><line x1="170" y1="168" x2="630" y2="168" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="162.0" font-size="11" fill="#555" text-anchor="middle">연결 요청 (간격 15ms)</text><line x1="170" y1="216" x2="630" y2="216" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="210.0" font-size="11" fill="#555" text-anchor="middle">보안 L2 → Just Works 페어링·본딩</text><line x1="630" y1="264" x2="170" y2="264" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="258.0" font-size="11" fill="#555" text-anchor="middle">암호화 완료 → settings_save()</text><line x1="170" y1="312" x2="630" y2="312" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="306.0" font-size="11" fill="#555" text-anchor="middle">GATT 탐색: 0x2A4C, 0x2A4B, CCCD</text><line x1="170" y1="360" x2="630" y2="360" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="354.0" font-size="11" fill="#555" text-anchor="middle">CCCD 구독 (최대 6개)</text><line x1="170" y1="408" x2="630" y2="408" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="402.0" font-size="11" fill="#555" text-anchor="middle">Report Map 읽기, Control Point 쓰기</text><line x1="630" y1="456" x2="170" y2="456" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="450.0" font-size="11" fill="#555" text-anchor="middle">입력 리포트 Notification (≥14바이트)</text><line x1="630" y1="504" x2="170" y2="504" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><text x="400.0" y="498.0" font-size="11" fill="#555" text-anchor="middle">… 반복 (bldPadGetInfo로 읽기)</text><text x="400" y="585" font-size="12" font-weight="normal" fill="#555" text-anchor="middle">끊어지면 본딩 정보를 다시 읽고 스캔을 재시작</text>
