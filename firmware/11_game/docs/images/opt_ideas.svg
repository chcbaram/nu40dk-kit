<text x="138" y="175" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">확인 (명령보다 3.5배 무거웠다)</text>
<text x="40" y="205" font-size="11.5" font-weight="bold" fill="#3b6fb6" text-anchor="start">후: 다음 이벤트까지 사이클만 더해 두고, 그때 한 번 처리</text>
