<text x="768" y="191" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">계산만 (게임 진행)</text>
<text x="520" y="231" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">왜 빨라졌나: 줄 그리기가 프레임 시간의 약 1/3 이었다.</text>
<text x="520" y="251" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">아무도 안 볼 프레임은 게임 상태만 진행하고 그리지 않는다.</text>
<text x="520" y="281" font-size="11" font-weight="normal" fill="#777" text-anchor="start">덤: 그리지 않는 줄에서도 160바이트를 지우던 memset 을</text>
<text x="520" y="299" font-size="11" font-weight="normal" fill="#777" text-anchor="start">"그릴지" 판단 뒤로 옮겨 13~17% 를 더 줄였다.</text>
