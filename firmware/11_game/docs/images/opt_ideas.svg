<text x="40" y="495" font-size="10.5" font-weight="normal" fill="#555" text-anchor="start">↑ 한 타일 8픽셀 = 24번 작업</text>
<text x="40" y="523" font-size="11.5" font-weight="bold" fill="#3b6fb6" text-anchor="start">후: 팔레트를 미리 적용한 "4픽셀 표"를 두 번 조회</text>
