<text x="520" y="593" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">왜 빨라졌나: 읽기·비교만 하는 루프는 타이머·인터럽트가</text>
<text x="520" y="613" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">오기 전까지 결과가 같다. 그 시간만큼 사이클을 바로 더한다.</text>
<text x="520" y="635" font-size="11" font-weight="normal" fill="#777" text-anchor="start">소리 데이터 체크섬이 켜고 끌 때 같아 결과가 같음을 확인.</text>
