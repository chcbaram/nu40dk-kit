<text x="490.0" y="32" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">핵심 최적화 4가지: 무엇을 안 하게 만들었나</text>
<rect x="20" y="55" width="460" height="300" rx="12" fill="#fafbfd" stroke="#cfd5de"/>
