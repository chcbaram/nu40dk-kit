<text x="40" y="275" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">왜 빨라졌나: 확인은 대부분 "아직 아님"으로 끝난다.</text>
<text x="40" y="295" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">언제 일이 생기는지 미리 계산해 그때만 본다.</text>
<text x="40" y="317" font-size="11" font-weight="normal" fill="#777" text-anchor="start">타이머 값을 읽거나 IO 를 쓸 때는 먼저 맞춰 둬서 결과는 같다.</text>
