<text x="342" y="550" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">표 조회 1번 = 4픽셀</text>
<text x="40" y="579" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">왜 빨라졌나: 배경은 8픽셀 타일로 되어 있다. 같은 계산을</text>
<text x="40" y="599" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">픽셀마다 반복하지 않고 표(1KB)로 한 번에 꺼낸다.</text>
<text x="40" y="621" font-size="11" font-weight="normal" fill="#777" text-anchor="start">표는 팔레트가 바뀔 때만 다시 만든다. 결과 화면은 같다 (확인).</text>
