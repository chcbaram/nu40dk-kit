<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#5b6b7f"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="980" height="470" fill="#ffffff"/>
<text x="490.0" y="32" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">게임팩 ROM: SD → 내장 Flash 복사 후 XIP 실행</text>
<rect x="20" y="70" width="190" height="80" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="115.0" y="98.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">SD /roms/game.gb</text>
<text x="115.0" y="117.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">32KB ~ 512KB</text>
<text x="115.0" y="133.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">런처 EMUL 에서 선택</text>
<rect x="270" y="70" width="220" height="80" rx="10" fill="#fff4dc" stroke="#c98a00" stroke-width="1.5" filter="url(#sh)"/>
<text x="380.0" y="98.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">① 같은 ROM 인가?</text>
<text x="380.0" y="117.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">헤더 0x100~0x14F (제목·체크섬)</text>
<text x="380.0" y="133.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">+ 파일 크기 비교</text>
<line x1="210" y1="110" x2="270" y2="110" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="208" y="88" width="64" height="17" rx="8.5" fill="#f2f4f7" stroke="#d5dae1"/>
<text x="240.0" y="101" font-size="10.5" font-weight="normal" fill="#3d4a5c" text-anchor="middle">헤더 읽기</text>
<rect x="550" y="70" width="190" height="80" rx="10" fill="#eefbef" stroke="#3a9a4a" stroke-width="1.5" filter="url(#sh)"/>
<text x="645.0" y="98.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">건너뜀</text>
<text x="645.0" y="117.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">바로 실행 (몇 ms)</text>
<text x="645.0" y="133.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">Flash 수명 절약</text>
<line x1="490" y1="110" x2="550" y2="110" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="502" y="88" width="36" height="17" rx="8.5" fill="#f2f4f7" stroke="#d5dae1"/>
<text x="520.0" y="101" font-size="10.5" font-weight="normal" fill="#3d4a5c" text-anchor="middle">같음</text>
<rect x="270" y="190" width="470" height="120" rx="12" fill="#fbfbfd" stroke="#9aa6b8" stroke-dasharray="6,4"/>
<text x="282" y="210" font-size="12" font-weight="bold" fill="#3d4a5c" text-anchor="start">② 다르면 4KB 씩 반복 (512KB 약 23초, 진행률 표시)</text>
<rect x="285" y="225" width="95" height="62" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="332.5" y="252.5" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">SD 읽기</text>
<text x="332.5" y="271.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">f_read</text>
<rect x="398" y="225" width="95" height="62" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="445.5" y="252.5" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">지우기</text>
<text x="445.5" y="271.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">4KB 페이지</text>
<line x1="380" y1="256" x2="398" y2="256" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="511" y="225" width="95" height="62" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="558.5" y="252.5" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">쓰기</text>
<text x="558.5" y="271.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">flash_area_write</text>
<line x1="493" y1="256" x2="511" y2="256" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="624" y="225" width="95" height="62" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="671.5" y="252.5" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">검증</text>
<text x="671.5" y="271.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">memcmp</text>
<line x1="606" y1="256" x2="624" y2="256" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<line x1="380" y1="150" x2="380" y2="190" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="384" y="164" width="36" height="17" rx="8.5" fill="#f2f4f7" stroke="#d5dae1"/>
<text x="390" y="177" font-size="10.5" font-weight="normal" fill="#3d4a5c" text-anchor="start">다름</text>
<text x="505" y="330" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">page_buf (RAM 4KB) 하나로 처리 — ROM 전체를 RAM 에 올리지 않는다</text>
<rect x="800" y="60" width="160" height="250" rx="10" fill="#fafafa" stroke="#666" stroke-width="1.5" filter="url(#sh)"/>
<text x="880" y="84" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">내장 Flash 1MB</text>
<rect x="815" y="95" width="130" height="70" rx="4" fill="#cfe0f7" stroke="#888"/>
<text x="880" y="128.0" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">app</text>
<text x="880" y="143.0" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">0x00000 · 504KB</text>
<rect x="815" y="170" width="130" height="110" rx="4" fill="#ffe9b8" stroke="#888"/>
<text x="880" y="223.0" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">rom_storage</text>
<text x="880" y="238.0" font-size="10" font-weight="normal" fill="#555" text-anchor="middle">0x7E000 · 512KB</text>
<rect x="815" y="285" width="130" height="18" rx="4" fill="#d8f0d8" stroke="#888"/>
<text x="880" y="292.0" font-size="11" font-weight="bold" fill="#111" text-anchor="middle"></text>
<text x="880" y="307.0" font-size="10" font-weight="normal" fill="#555" text-anchor="middle"></text>
<text x="880" y="298" font-size="9" font-weight="normal" fill="#333" text-anchor="middle">settings 8KB</text>
<line x1="740" y1="256" x2="815" y2="226" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="760" y="220" width="36" height="17" rx="8.5" fill="#f2f4f7" stroke="#d5dae1"/>
<text x="777.5" y="233" font-size="10.5" font-weight="normal" fill="#3d4a5c" text-anchor="middle">쓰기</text>
<rect x="270" y="370" width="470" height="80" rx="10" fill="#fff4dc" stroke="#c98a00" stroke-width="1.5" filter="url(#sh)"/>
<text x="505.0" y="398.0" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">③ 실행: Walnut-CGB 가 Flash 를 포인터로 직접 읽음 (XIP)</text>
<text x="505.0" y="417.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">rom_base = 0x7E000 · 읽기 = rom_base[addr] (WGB_ROM_READ 매크로)</text>
<text x="505.0" y="433.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">MBC 뱅크 전환 = 오프셋만 바꿈 · 캐시 있는 Flash 라 코드 실행과 같은 속도</text>
<path d="M880,310 L880,410 L740,410" fill="none" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="886" y="350" width="56" height="17" rx="8.5" fill="#f2f4f7" stroke="#d5dae1"/>
<text x="914" y="363" font-size="10.5" font-weight="normal" fill="#3d4a5c" text-anchor="middle">XIP 읽기</text>
<path d="M740,130 L770,130 L770,390 L742,390" fill="none" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)"/>
</svg>