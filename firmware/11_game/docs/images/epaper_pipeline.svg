<text x="490.0" y="313.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">epdUpdateStrong</text>
<text x="490.0" y="329.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">2.8초</text>
<text x="490.0" y="345.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">부팅·게임 종료·장면 전환</text>
<rect x="660" y="255" width="300" height="120" rx="10" fill="#f0f0f0" stroke="#666" stroke-width="1.5" filter="url(#sh)"/>
<text x="810.0" y="294.5" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">저온 전체</text>
<text x="810.0" y="313.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">epdUpdateCold(10°C)</text>
<text x="810.0" y="329.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">1.25초</text>
<text x="810.0" y="345.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">런처 화면 전환·정리</text>
<rect x="20" y="395" width="300" height="120" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="170.0" y="434.5" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">FAST 45</text>
