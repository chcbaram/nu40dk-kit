<text x="170.0" y="469.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">약 0.4초</text>
<text x="170.0" y="485.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">런처 메뉴 이동·RPG 대화</text>
<rect x="340" y="395" width="300" height="120" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="490.0" y="434.5" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">QUICK 8</text>
<text x="490.0" y="453.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">epdUpdate(FAST)</text>
<text x="490.0" y="469.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">약 0.1초</text>
<text x="490.0" y="485.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">RPG 걷기</text>
