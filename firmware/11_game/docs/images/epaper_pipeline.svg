<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#5b6b7f"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="980" height="470" fill="#ffffff"/>
<text x="490.0" y="32" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">게임 화면이 EPAPER 에 그려지는 과정</text>
<rect x="20" y="118" width="170" height="150" rx="12" fill="#fff4dc" stroke="#c98a00" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="42" cy="140" r="13" fill="#c98a00"/>
<text x="42" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="115.0" y="146" font-size="13.5" font-weight="bold" fill="#111" text-anchor="middle">화면 받기</text>
<text x="105.0" y="174" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">에뮬레이터가 그린 GB 화면</text>
<text x="105.0" y="190" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">(4단계 회색, 160×144)</text>
<text x="105.0" y="214" font-size="10" font-weight="normal" fill="#8a94a3" text-anchor="middle">lcd_buf</text>
<rect x="30" y="228" width="150" height="28" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
<text x="105.0" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">예: 이 픽셀이 흰색 → 진회색</text>
<rect x="212" y="118" width="170" height="150" rx="12" fill="#fff4dc" stroke="#c98a00" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="234" cy="140" r="13" fill="#c98a00"/>
<text x="234" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="307.0" y="146" font-size="13.5" font-weight="bold" fill="#111" text-anchor="middle">몇 번 밀지 계산</text>
<text x="297.0" y="174" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">바뀐 픽셀만 골라</text>
<text x="297.0" y="190" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">출발 색·목표 색·이력으로</text>
<text x="297.0" y="214" font-size="10" font-weight="normal" fill="#8a94a3" text-anchor="middle">펄스 계획 inkPlan</text>
<rect x="222" y="228" width="150" height="28" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
<text x="297.0" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">예: 검정 쪽으로 3번</text>
<line x1="190" y1="193.0" x2="212" y2="193.0" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="404" y="118" width="170" height="150" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="426" cy="140" r="13" fill="#3b6fb6"/>
<text x="426" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="499.0" y="146" font-size="13.5" font-weight="bold" fill="#111" text-anchor="middle">할 일 적어 두기</text>
<text x="489.0" y="174" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">픽셀마다</text>
<text x="489.0" y="190" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">남은 횟수를 기록</text>
<text x="489.0" y="214" font-size="10" font-weight="normal" fill="#8a94a3" text-anchor="middle">카운터 ink_cnt</text>
<rect x="414" y="228" width="150" height="28" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
<text x="489.0" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">예: 남은 횟수 3</text>
<line x1="382" y1="193.0" x2="404" y2="193.0" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="596" y="118" width="170" height="150" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="618" cy="140" r="13" fill="#3b6fb6"/>
<text x="618" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="691.0" y="146" font-size="13.5" font-weight="bold" fill="#111" text-anchor="middle">이번에 밀 픽셀 표시</text>
<text x="681.0" y="174" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">남은 횟수가 있는 픽셀을</text>
<text x="681.0" y="190" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">검정 표 / 흰색 표에 체크</text>
<text x="681.0" y="214" font-size="10" font-weight="normal" fill="#8a94a3" text-anchor="middle">스캔 마스크</text>
<rect x="606" y="228" width="150" height="28" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
<text x="681.0" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">예: 검정 표에 ✓</text>
<line x1="574" y1="193.0" x2="596" y2="193.0" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<rect x="788" y="118" width="170" height="150" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<circle cx="810" cy="140" r="13" fill="#3b6fb6"/>
<text x="810" y="145" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
<text x="883.0" y="146" font-size="13.5" font-weight="bold" fill="#111" text-anchor="middle">패널에 보내고 밀기</text>
<text x="873.0" y="174" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">두 표를 컨트롤러 RAM 에</text>
<text x="873.0" y="190" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">보내고 32ms 펄스 한 번</text>
<text x="873.0" y="214" font-size="10" font-weight="normal" fill="#8a94a3" text-anchor="middle">epdUpdateMask</text>
<rect x="798" y="228" width="150" height="28" rx="6" fill="#ffffff" stroke="#e1e5eb"/>
<text x="873.0" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">예: 밝기 1.00 → 0.80</text>
<line x1="766" y1="193.0" x2="788" y2="193.0" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<path d="M20,102 L20,92 L382,92 L382,102" fill="none" stroke="#c98a00" stroke-width="2"/>
<rect x="51.0" y="68" width="300" height="20" rx="10" fill="#ffffff"/>
<text x="201.0" y="83" font-size="12" font-weight="bold" fill="#c98a00" text-anchor="middle">새 GB 프레임이 올 때만 (약 83ms 마다)</text>
<path d="M404,102 L404,92 L958,92 L958,102" fill="none" stroke="#3b6fb6" stroke-width="2"/>
<rect x="531.0" y="68" width="300" height="20" rx="10" fill="#ffffff"/>
<text x="681.0" y="83" font-size="12" font-weight="bold" fill="#3b6fb6" text-anchor="middle">남은 일이 있으면 계속 반복 (스캔 한 번 32ms + 전송)</text>
<path d="M873.0,268 L873.0,308 L681.0,308 L681.0,270" fill="none" stroke="#3b6fb6" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="627.0" y="298" width="300" height="20" rx="10" fill="#eef3fb" stroke="#bcd0ea"/>
<text x="777.0" y="312" font-size="11" font-weight="bold" fill="#3b6fb6" text-anchor="middle">밀었으면 남은 횟수 −1 → 0 이 될 때까지 4·5 반복</text>
<rect x="20" y="338" width="940" height="118" rx="12" fill="#fbfaf5" stroke="#e5dcc0"/>
<text x="40" y="364" font-size="13" font-weight="bold" fill="#6b4e00" text-anchor="start">비유: 칠판에 그림을 옮기는 조수</text>
<text x="40" y="388" font-size="11.5" font-weight="normal" fill="#4a3d10" text-anchor="start">① 사진사(에뮬레이터)가 새 사진을 건넨다 → ② 지난 사진과 비교해 "이 칸은 3번 더 어둡게" 같은 작업 지시서를 쓴다</text>
<text x="40" y="408" font-size="11.5" font-weight="normal" fill="#4a3d10" text-anchor="start">③ 칸마다 남은 횟수를 적어 둔다 → ④⑤ 조수가 한 바퀴 돌며 남은 칸만 붓질 한 번씩, 횟수를 하나씩 지운다</text>
<text x="40" y="428" font-size="11.5" font-weight="normal" fill="#4a3d10" text-anchor="start">사진이 자주 와도 조수는 자기 속도로 붓질만 계속하고, 할 일이 없으면 쉰다 (정지 화면 = 붓질 0 = 전력 0)</text>
</svg>