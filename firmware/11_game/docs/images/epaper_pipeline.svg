<text x="880.0" y="104.5" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">epdUpdateMask</text>
<text x="880.0" y="123.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">SPIM2 8MHz 4KB×4</text>
<text x="880.0" y="139.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">커스텀 LUT 32ms</text>
<text x="880.0" y="155.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">정지 화면 구동 0</text>
<line x1="765" y1="125" x2="800" y2="125" stroke="#5b6b7f" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)"/>
<text x="490" y="200" font-size="11" font-weight="normal" fill="#555" text-anchor="middle">스캔(32ms)마다 카운터가 남은 픽셀만 한 펄스씩 구동 → 카운터 0 이 되면 멈춤. 장면 전환(40% 이상 바뀜)·정리 때는 F7 전체 갱신</text>
<text x="20" y="240" font-size="13" font-weight="bold" fill="#3b6fb6" text-anchor="start">갱신 모드</text>
<rect x="20" y="255" width="300" height="120" rx="10" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5" filter="url(#sh)"/>
<text x="170.0" y="294.5" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">마스크 구동</text>
<text x="170.0" y="313.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">epdUpdateMask</text>
<text x="170.0" y="329.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">스캔 1회 32ms</text>
<text x="170.0" y="345.5" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">게임 화면</text>
