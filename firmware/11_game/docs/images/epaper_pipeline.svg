<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1.5 L11,6 L1,10.5 L3.5,6 z" fill="#5b6b7f"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter></defs>
<rect width="980" height="560" fill="#ffffff"/>
<text x="490.0" y="32" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">EPAPER 갱신 파이프라인 (최종)</text>
<text x="20" y="62" font-size="13" font-weight="bold" fill="#3b6fb6" text-anchor="start">게임 화면 (회색 모드, gb_disp 스레드)</text>
