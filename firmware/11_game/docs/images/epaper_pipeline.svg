<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<text x="450" y="30" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">EPAPER 갱신 파이프라인</text><rect x="20" y="60" width="150" height="80" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="95.0" y="96.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">GB 라인 콜백</text><text x="95.0" y="114.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">160px × 2bit</text><line x1="170" y1="100" x2="196" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="196" y="60" width="150" height="80" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="271.0" y="96.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">2×2 디더</text><text x="271.0" y="114.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">→ 320px × 2줄 1bpp</text><line x1="346" y1="100" x2="372" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="372" y="60" width="150" height="80" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="447.0" y="96.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">프레임 버퍼</text><text x="447.0" y="114.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">400×300 1bpp 15KB</text><line x1="522" y1="100" x2="548" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="548" y="60" width="150" height="80" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="623.0" y="87.0" font-size="14" font-weight="bold" fill="#111" text-anchor="middle">SPI 전송</text><text x="623.0" y="105.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">SPIM3 · 0x24 RAM</text><text x="623.0" y="123.0" font-size="11" font-weight="normal" fill="#444" text-anchor="middle">윈도우 320×288</text><line x1="698" y1="100" x2="724" y2="100" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/><rect x="724" y="60" width="150" height="80" rx="8" fill="#eef3fb" stroke="#3b6fb6" 